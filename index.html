<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Build Log</title>
<style>
  :root {
    --paper: #f7f5f0;
    --ink: #201f1c;
    --ink-soft: #56524a;
    --line: #d8d3c6;
    --accent: #2f6b4f;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #3a3733;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
    font-family: var(--sans);
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    border-radius: 4px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--ink-soft);
    margin: 0 0 0.5rem;
    text-transform: uppercase;
  }
  h1 { font-size: 1.9rem; margin: 0 0 0.5rem; }
  .intro { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; margin: 0 0 2rem; max-width: 50ch; }
  .project {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 0;
    border-top: 1px solid var(--line);
  }
  .project:last-child { border-bottom: 1px solid var(--line); }
  .project-info h2 { font-size: 1.05rem; margin: 0 0 0.2rem; }
  .project-info p { margin: 0; font-size: 0.85rem; color: var(--ink-soft); }
  .status {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    white-space: nowrap;
  }
  .status--live { background: var(--accent); color: #fff; }
  .status--planned { background: #e3ded1; color: var(--ink-soft); }

    text-decoration: none;
    color: inherit;
